<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        /* Modern, clean styling for the webpage */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #ffffff;
            background-color: #3498db;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>This is a standard paragraph of text on a basic web page.</p>
    
    <!-- This is a comment. It won't show up in the browser. -->
    <a href="https://example.com" target="_blank">Click here to visit a link</a>

</body>
</html>
